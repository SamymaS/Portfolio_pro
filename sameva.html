<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sameva - preview V4 des ecrans de l'application">
  <title>Sameva - Preview V4</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Saira+Condensed:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#10173a;
      --bg-2:#1a2a57;
      --line:rgba(255,255,255,.14);
      --txt:#edf3ff;
      --muted:#afc0ed;
      --teal:#4fd8c6;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Archivo',sans-serif;
      color:var(--txt);
      min-height:100vh;
      background:
        radial-gradient(900px 500px at 10% -10%, rgba(138,99,224,.32), transparent 62%),
        radial-gradient(900px 500px at 90% 0%, rgba(79,216,198,.18), transparent 56%),
        linear-gradient(160deg,var(--bg),var(--bg-2));
    }
    .back{
      position:fixed;top:14px;left:14px;z-index:10;
      display:inline-flex;align-items:center;gap:8px;
      padding:10px 14px;border-radius:12px;border:1px solid var(--line);
      color:var(--txt);text-decoration:none;background:rgba(9,14,30,.75);
      font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
      backdrop-filter:blur(8px);
      transition:.25s ease;
    }
    .back:hover{border-color:var(--teal);color:var(--teal);transform:translateY(-2px)}
    .wrap{max-width:1220px;margin:0 auto;padding:64px 20px 44px}
    .head{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
    .kicker{
      color:#062522;background:var(--teal);border-radius:999px;
      width:max-content;padding:6px 12px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    }
    h1{
      font-family:'Saira Condensed',sans-serif;
      font-size:clamp(2rem,5vw,3.8rem);
      text-transform:uppercase;
      letter-spacing:.04em;
      line-height:.92;
    }
    .sub{color:var(--muted);font-size:14px;line-height:1.6;max-width:840px}
    .preview{
      margin-top:18px;
      border:1px solid var(--line);
      border-radius:22px;
      padding:14px;
      background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
      box-shadow:0 24px 48px -30px rgba(0,0,0,.8);
    }
    .preview img{
      width:100%;
      height:auto;
      display:block;
      border-radius:14px;
    }
    .foot{
      margin-top:14px;
      color:var(--muted);
      font-size:12px;
      text-align:center;
    }
  </style>
</head>
<body>
  <a class="back" href="index.html" aria-label="Retour au portfolio">← Retour portfolio</a>
  <main class="wrap">
    <header class="head">
      <span class="kicker">Nouvelle actualite Sameva</span>
      <h1>Futures pages de l'application</h1>
      <p class="sub">Version alignee a la preview V4 avec la planche complete des ecrans et le rendu visuel attendu.</p>
    </header>
    <section class="preview" aria-label="Preview Sameva V4">
      <img src="assets/v4_preview.png" alt="Preview V4 des ecrans Sameva">
    </section>
    <p class="foot">Sameva V4 - rendu de reference pour la presentation jury.</p>
  </main>
</body>
</html>
